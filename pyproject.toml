[project]
name = "tiny-transformer"
version = "0.1.0"
description = "Learn a character-level Transformer through guided exercises"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "torch>=2.6,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transformer"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "exercise: checks for unfinished learning exercises",
    "milestone2: single-head causal self-attention checks",
    "milestone3: multi-head causal self-attention checks",
]

[tool.ruff]
line-length = 88
target-version = "py312"
